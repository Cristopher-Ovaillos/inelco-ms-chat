name: CI

on:
  push:
    branches: [desarrollo, stage, produccion]
  pull_request:
    branches: [desarrollo, stage, produccion]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run swagger
      - run: npm audit --omit=dev --audit-level=high
      #falta npm test cuando haya un runner de tests
